<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>네온 티라노 게임 - Neon T-Rex</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b240b;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            transition: background-color 1s ease;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 15px 0;
            text-shadow: 0 0 10px #00ffff;
            font-size: 2rem;
            letter-spacing: 3px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
        }
        canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 8 / 3;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            background-color: #0b240b;
            transition: background-color 1s ease;
            display: block;
        }
        #instructions {
            margin-top: 15px;
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>NEON T-REX</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
    </div>
    <div id="instructions">
        스페이스바(Space) 또는 위쪽 화살표(↑)를 눌러 점프하세요!<br>
        (모바일 환경에서는 화면을 터치하세요)
    </div>

    <script>
        // DOM 이 완전히 로드된 후 실행되도록 안심 처리
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            // 게임 상태 변수
            let score = 0;
            let gameSpeed = 6;
            let isGameOver = false;
            let frameCount = 0;
            let animationFrameId = null;

            // 테마 설정 (정글 -> 바다 -> 화산 순환)
            const themes = [
                { name: "JUNGLE", bg: '#0b240b', ground: '#1e5e1e', obstacle: '#4caf50' },
                { name: "OCEAN", bg: '#09152b', ground: '#1a3b70', obstacle: '#2196f3' },
                { name: "VOLCANO", bg: '#2b0a0a', ground: '#701a1a', obstacle: '#f44336' }
            ];

            // 플레이어(티라노) 객체
            const dino = {
                x: 50,
                y: 200,
                w: 40,
                h: 50,
                dy: 0,
                gravity: 0.6,
                jumpPower: -11,
                isGrounded: true,
                
                draw() {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00ffff'; 
                    ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.rect(this.x + 20, this.y, 20, 20);      // 머리
                    ctx.rect(this.x + 10, this.y + 20, 25, 20); // 몸통
                    ctx.rect(this.x, this.y + 20, 10, 10);      // 꼬리
                    ctx.rect(this.x + 10, this.y + 40, 6, 10);  // 왼쪽 다리
                    ctx.rect(this.x + 25, this.y + 40, 6, 10);  // 오른쪽 다리
                    
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                },

                update() {
                    if (!this.isGrounded) {
                        this.dy += this.gravity;
                    }
                    this.y += this.dy;

                    if (this.y >= 200) {
                        this.y = 200;
                        this.dy = 0;
                        this.isGrounded = true;
                    }

                    this.draw();
                },

                jump() {
                    if (this.isGrounded) {
                        this.dy = this.jumpPower;
                        this.isGrounded = false;
                    }
                }
            };

            // 장애물 관리
            let obstacles = [];

            class Obstacle {
                constructor() {
                    this.w = 20 + Math.random() * 20;
                    this.h = 30 + Math.random() * 40;
                    this.x = canvas.width;
                    this.y = 250 - this.h;
                }

                draw(theme) {
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = theme.obstacle;
                    ctx.fillStyle = theme.obstacle;
                    
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(this.x, this.y, this.w, this.h);
                    ctx.restore();
                }

                update(theme) {
                    this.x -= gameSpeed;
                    this.draw(theme);
                }
            }

            function handleObstacles(theme) {
                if (frameCount % 100 === 0 || (frameCount % 60 === 0 && Math.random() > 0.6)) {
                    obstacles.push(new Obstacle());
                }

                for (let i = 0; i < obstacles.length; i++) {
                    obstacles[i].update(theme);

                    // AABB 충돌 처리
                    if (
                        dino.x < obstacles[i].x + obstacles[i].w &&
                        dino.x + dino.w > obstacles[i].x &&
                        dino.y < obstacles[i].y + obstacles[i].h &&
                        dino.y + dino.h > obstacles[i].y
                    ) {
                        isGameOver = true;
                    }

                    if (obstacles[i].x + obstacles[i].w < 0) {
                        obstacles.splice(i, 1);
                        i--;
                    }
                }
            }

            function drawBackground(theme) {
                canvas.style.backgroundColor = theme.bg;
                document.body.style.backgroundColor = theme.bg === '#0b240b' ? '#051205' : (theme.bg === '#09152b' ? '#030a17' : '#140404');
                
                ctx.fillStyle = theme.ground;
                ctx.fillRect(0, 250, canvas.width, 50);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.font = 'bold 70px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(theme.name, canvas.width / 2, 160);
            }

            function drawScore() {
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px Courier New';
                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${Math.floor(score)}`, canvas.width - 20, 30);
            }

            function animate() {
                if (isGameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 30px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                    ctx.font = '20px Courier New';
                    ctx.fillText(`최종 점수: ${Math.floor(score)}`, canvas.width / 2, canvas.height / 2 + 20);
                    ctx.fillText('스페이스바 / 터치하여 재시작', canvas.width / 2, canvas.height / 2 + 60);
                    return;
                }

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 1000점 단위 테마 순환
                let themeIndex = Math.floor(score / 1000) % 3;
                let currentTheme = themes[themeIndex];

                drawBackground(currentTheme);
                dino.update();
                handleObstacles(currentTheme);
                drawScore();

                score += 1;
                frameCount++;
                if (score % 500 === 0) gameSpeed += 0.5;

                animationFrameId = requestAnimationFrame(animate);
            }

            function triggerAction() {
                if (isGameOver) {
                    resetGame();
                } else {
                    dino.jump();
                }
            }

            // 키보드 & 터치 이벤트 바인딩
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault(); // 스크롤 차단
                    triggerAction();
                }
            });

            window.addEventListener('touchstart', (e) => {
                triggerAction();
            }, { passive: true });

            canvas.addEventListener('mousedown', () => {
                triggerAction();
            });

            function resetGame() {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                score = 0;
                gameSpeed = 6;
                frameCount = 0;
                obstacles = [];
                isGameOver = false;
                dino.y = 200;
                dino.dy = 0;
                animate();
            }

            animate();
        });
    </script>
</body>
</html>
